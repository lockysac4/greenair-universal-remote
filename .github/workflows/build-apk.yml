name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build both remote apps
        run: gradle :app:assembleUniversalDebug :app:assemblePhilipsDebug --stacktrace

      - name: Upload Universal Remote APK
        uses: actions/upload-artifact@v4
        with:
          name: GreenairUniversalRemote-v0.6.3-debug
          path: app/build/outputs/apk/universal/debug/app-universal-debug.apk
          if-no-files-found: error

      - name: Upload Philips Remote APK
        uses: actions/upload-artifact@v4
        with:
          name: GreenairPhilipsRemote-v1.0.0-debug
          path: app/build/outputs/apk/philips/debug/app-philips-debug.apk
          if-no-files-found: error
